services:
  php:
    image: php:8.4.4-fpm
    volumes:
      - ./web:/lab/web:ro
      - ./config/php.ini:/usr/local/etc/php/conf.d/lab.ini:ro
    tmpfs:
      - /tmp
    networks: [lab]
  nginx:
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:18085:80"
    volumes:
      - ./web:/lab/web:ro
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]
    networks: [lab]
networks:
  lab:
    internal: true
