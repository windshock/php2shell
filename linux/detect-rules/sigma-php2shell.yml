title: PHP fatal memory exhaustion while parsing request input
id: 7b2d9f10-3c48-4e6a-9d15-2f8b7c0a6e33
status: experimental
description: >
  Detects memory-limit fatals in PHP logs. Correlate the timestamp with a large
  or multipart POST to separate parsing-time exhaustion (CVE-2026-109618
  direction) from ordinary long-running scripts.
logsource:
  product: php
  service: fpm
detection:
  selection_limit:
    message|contains: 'Allowed memory size of'
  selection_exhausted:
    message|contains: 'exhausted'
  condition: selection_limit and selection_exhausted
fields:
  - host
  - pool
  - pid
falsepositives:
  - Legitimate memory-limit hits inside application code
level: medium

---
title: PHP-FPM worker terminated (signal or exit code 70)
id: a3f5c821-6d74-4b09-8e2c-1d9f4a7b3c58
status: experimental
description: >
  Detects worker death recorded by the FPM master. In the lab, a failure during
  request startup terminates the worker with code 70. This rule is one side of a
  correlation: join it with a multipart POST rule (below) on host+pool within a
  few seconds in the SIEM; Sigma itself does not express joins.
logsource:
  product: php
  service: fpm
detection:
  selection_code:
    message|contains: 'exited with code 70'
  selection_signal:
    message|contains: 'exited on signal'
  condition: selection_code or selection_signal
fields:
  - host
  - pool
  - pid
falsepositives:
  - Deploys, OOM killer, unrelated crashes
level: high

---
title: Multipart POST to a PHP-handled endpoint (correlation counterpart)
id: c9e4b7a3-2f61-4d8c-9a47-5b1e3f8d2c06
status: experimental
description: >
  Counterpart for joining with the worker-termination rule. Matches multipart
  POSTs regardless of the visible path: front-controller rewriting means the URL
  often has no .php suffix (the lab serves /upload through index.php). Join on
  host plus a short window in the SIEM. Expected to be high volume; use only as
  a correlation input, never as a standalone alert.
logsource:
  category: webserver
detection:
  selection_method:
    cs-method: POST
  selection_type:
    cs-content-type|contains: 'multipart/form-data'
  condition: selection_method and selection_type
fields:
  - c-ip
  - cs-uri-stem
falsepositives:
  - Normal file uploads (expected high volume)
level: low
