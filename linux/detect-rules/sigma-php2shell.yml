title: PHP upload progress field with duplicate or extra multipart parameters
id: 4e1c7a52-9b3d-4a1e-8f27-6c5d2b9e1a41
status: experimental
description: >
  Detects multipart POST bodies that carry PHP_SESSION_UPLOAD_PROGRESS while the
  part header also contains a duplicate or extra name parameter. In the lab this
  shape bypassed name-based WAF rules while PHP still used the field as the
  upload-progress key. Requires raw request-body logging.
references:
  - https://github.com/windshock/php2shell/blob/main/docs/php2shell-analysis-findings.md
author: php2shell lab
date: 2026/10/21
logsource:
  category: webserver
detection:
  selection_method:
    cs-method: POST
  selection_body:
    request_body|contains: 'PHP_SESSION_UPLOAD_PROGRESS'
    cs-content-type|contains: 'multipart/form-data'
  selection_duplicate:
    request_body|re: 'name\s*=\s*"[^"]+"\s*;\s*name\s*='
  selection_extra:
    request_body|re: '(?i)content-disposition:[^\r\n]*;\s*\w+\s*=\s*"[^"]*"\s*;\s*name\s*='
  condition: selection_method and selection_body and (selection_duplicate or selection_extra)
fields:
  - c-ip
  - cs-uri-stem
  - cs-content-type
falsepositives:
  - Applications that legitimately repeat form field names inside one part (rare)
level: high

