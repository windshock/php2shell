# PHP2Shell detection rules (ModSecurity 2.9.x)
#
# MEASURED EFFECT (linux/waf-compare.py, ModSecurity 2.9.7, PHP 8.4.4):
#   baseline @streq ARGS_NAMES          : 5/10 blocked, 2 PHP-reachable bypasses
#   + FILES_NAMES (this file)           : 6/10 blocked, 2 PHP-reachable bypasses
#
# The extra block is the filename-first variant, which PHP never used as the
# progress field. The two shapes that DO reach PHP still pass:
#   form-data; name="foo"; name="PHP_SESSION_UPLOAD_PROGRESS"
#   form-data; foo="bar"; name="PHP_SESSION_UPLOAD_PROGRESS"
#
# CONCLUSION: this file is NOT a control and does not reduce the verified risk.
# It is kept as a baseline for environments that only have ModSecurity 2.9.x and
# as documentation of the gap. Close the gap with raw-body inspection at a
# proxy/gateway, or disable the feature:
#   session.upload_progress.enabled=0  (applied before workers start)
#
# Also note: SecRequestBodyLimit below rejects bodies above 8 MB. Tune it to the
# service before deploying, or legitimate uploads will fail.

SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 8388608
SecRequestBodyNoFilesLimit 1048576

# Baseline: exact field name as a form field.
SecRule ARGS_NAMES "@streq PHP_SESSION_UPLOAD_PROGRESS" "id:1001,phase:2,deny,status:403,log,t:none,msg:'PHP2Shell: upload progress field (ARGS_NAMES)'"

# Baseline: exact field name as an uploaded file part (catches filename-first shape).
SecRule FILES_NAMES "@streq PHP_SESSION_UPLOAD_PROGRESS" "id:1002,phase:2,deny,status:403,log,t:none,msg:'PHP2Shell: upload progress field (FILES_NAMES)'"

# Measured INEFFECTIVE on 2.9.7 for the duplicate/extra-parameter shapes:
# MULTIPART_PART_HEADERS does not expose the field name in a matchable form and
# REQUEST_BODY is unavailable after the multipart processor consumes the body.
# Do not re-enable without re-measuring.
