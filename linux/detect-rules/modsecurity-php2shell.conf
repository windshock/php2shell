# PHP2Shell detection rules (ModSecurity 2.9.x)
#
# Purpose: close the gap observed in the lab where a single
# "ARGS_NAMES @streq PHP_SESSION_UPLOAD_PROGRESS" rule missed
#   - duplicate name parameters   : form-data; name="foo"; name="PHP_SESSION_UPLOAD_PROGRESS"
#   - extra parameters            : form-data; foo="bar"; name="PHP_SESSION_UPLOAD_PROGRESS"
# while PHP's rfc1867 parser still used the field as the progress field.
#
# These rules inspect three collections so the part is caught regardless of
# which one ModSecurity populates for a given multipart shape.
# Validation: linux/waf-compare.py against this file (see docs/findings 5.6).
# Limits: body inspection limits and non-standard multipart encodings can still
# hide the field; this is detection hardening, not a virtual patch.

SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 8388608
SecRequestBodyNoFilesLimit 1048576

# 1) form field name (classic)
SecRule ARGS_NAMES "@contains PHP_SESSION_UPLOAD_PROGRESS" \
    "id:1001,phase:2,deny,status:403,log,t:none,\
    msg:'PHP2Shell: upload progress field (ARGS_NAMES)'"

# 2) uploaded file part name
SecRule FILES_NAMES "@contains PHP_SESSION_UPLOAD_PROGRESS" \
    "id:1002,phase:2,deny,status:403,log,t:none,\
    msg:'PHP2Shell: upload progress field (FILES_NAMES)'"

# 3) raw multipart part headers — measured INEFFECTIVE for the duplicate/extra-parameter
# shapes on ModSecurity 2.9.7 (both variants still reached PHP).
# Enable only after re-measuring on your engine; the field is not reliably exposed.
# SecRule MULTIPART_PART_HEADERS "@contains PHP_SESSION_UPLOAD_PROGRESS" \
#     "id:1003,phase:2,deny,status:403,log,t:none,msg:'PHP2Shell: progress field (part headers)'"

# 4) body-marker chain — also measured ineffective for multipart (REQUEST_BODY is not
# available once the multipart processor consumed it). Kept as documentation only.
# SecRule REQUEST_HEADERS:Content-Type "@contains multipart/form-data" \
#     "id:1004,phase:2,pass,log,t:none,nolog,chain,msg:'PHP2Shell: multipart with progress marker'"
#     SecRule REQUEST_BODY "@contains PHP_SESSION_UPLOAD_PROGRESS" "t:none,setvar:'tx.php2shell_progress_body=1'"
